<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- google fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

        <!-- portfolio / desktop icon -->
        <link rel="icon" type="image/webp" sizes="32x32" href="../assets/img/portfolio-site-icon.webp">

        <!-- jquery cdn -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js" integrity="sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

        <!-- tailwind css reset -->
        <link rel="stylesheet" href="../tailwind.config/output.css">

        <!-- custom css -->
         <link rel="stylesheet" href="../styles/pagestyles.css">

        <!-- page title -->
        <title>UrNetTribe | Event</title>
    </head>
    <body>

        <main>

            <section class="hero-section-events bg-no-repeat bg-center bg-cover w-full relative top-0" style="background-image: url(../assets/img/event-bg.jpg);">
                <!-- header section -->
                <header>
                    <!-- logo -->
                    <div class="logo font-bold"> <span class="logo-name1">Ur</span><span class="logo-name2">Net</span><span class="logo-name1">Tribe</span></div>
                    <!-- navigation -->
                    <nav>
                        <div id="close-tbn" style="color: red;opacity: 0.7;">&times;</div>
                        <ul id="my-list-of-headers">
                            <li><a href="../index.html">Home</a></li>
                            <li><a href="./events.html">Event</a></li>
                            <li><a href="./contact.html">Contact</a></li>
                        </ul>
                    </nav>
                    <!-- event reservation button -->
                    <button class="btn-reserve font-semibold uppercase cursor-pointer">
                        Dark <img src="../assets/svg/moon.svg" alt="moon icon" id="dark-icon">
                    </button>
                    <!-- font size controls -->
                    <div class="font-size-controls">
                        <button id="increase-font" class="font-control-btn">A+</button>
                        <button id="reset-font" class="font-control-btn">A</button>
                        <button id="decrease-font" class="font-control-btn">A-</button>
                    </div>
                    <!-- hamburger menu -->
                    <img src="../assets/svg/menu.svg" alt="menu button to open navigation" class="hamburger-menu">
                </header>

                <!-- main header -->
                <article class="header-event uppercase font-bold">Are you ready to choose your next event?</article>

            </section>

            <!-- search container -->
            <div class="searchContainer">
                <div class="formGroup">
                    <form action="">
                        <!-- event search container -->
                        <div class="eventSearchContainer">
                            <!-- event title -->
                            <label for="eventtitle"> Search Event
                                <input type="text" id="eventtitle" placeholder="Event Title">
                            </label>
                        </div>
                        <!-- event location/place container -->
                        <div class="eventSearchContainer">
                            <!-- event title -->
                            <label for="place"> Place
                                <input type="text" id="place" placeholder="Nottingham">
                            </label>
                        </div>
                    </form>
                </div>
            </div>

            <!-- filtering and sorting container -->
             <div class="filter-sort-container">
                <div class="filterContainer"></div>
                <div class="sortContainer"></div>
             </div>
        </main>


        <!-- javascript scripts -->
         <script src="../js/scripts.js"></script>
    </body>
</html>
